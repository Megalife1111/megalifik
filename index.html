<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0;url=/portal/login.html" />
    <title>MegaLife — переход…</title>
    <script type="module">
      try {
        const { user } = await fetch("/api/auth/me", { credentials: "include" }).then((r) => r.json());
        location.replace(user ? "/portal/dashboard.html?welcome=1" : "/portal/login.html");
      } catch {
        location.replace("/portal/login.html");
      }
    </script>
  </head>
  <body>
    <p><a href="/portal/login.html">Перейти на страницу входа</a></p>
  </body>
</html>
