<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сброс пароля — MegaLife</title>
    <link rel="stylesheet" href="/css/lms.css" />
  </head>
  <body class="lms-page">
    <main class="lms-shell">
      <div class="lms-card lms-auth-card">
        <h1 class="lms-title">Восстановление пароля</h1>
        <p class="lms-subtitle">Мы отправим ссылку для сброса</p>
        <div id="auth-alert" class="lms-alert" hidden></div>
        <form id="auth-form">
          <div class="lms-field">
            <label class="lms-label" for="identifier">Email или телефон</label>
            <input class="lms-input" id="identifier" name="identifier" required />
          </div>
          <button type="submit" class="lms-btn lms-btn-primary lms-btn-block" id="auth-submit">Отправить</button>
        </form>
        <p style="margin-top: 16px"><a class="lms-link" href="login.html">Назад ко входу</a></p>
      </div>
    </main>
    <script type="module">
      import { api } from "/js/lms/api.js";
      import { initAuthPage, showAlert } from "/js/lms/auth-common.js";
      const alert = document.getElementById("auth-alert");
      initAuthPage({
        async onSubmit(fd) {
          const data = await api("/api/auth/forgot-password", {
            method: "POST",
            body: { identifier: fd.get("identifier") },
          });
          let msg = data.message;
          if (data.devResetUrl) {
            msg += ` Ссылка для разработки: ${data.devResetUrl}`;
          }
          showAlert(alert, msg, "success");
        },
      });
    </script>
  </body>
</html>
