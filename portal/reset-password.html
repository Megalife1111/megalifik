<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Новый пароль — MegaLife</title>
    <link rel="stylesheet" href="/css/lms.css" />
  </head>
  <body class="lms-page">
    <main class="lms-shell">
      <div class="lms-card lms-auth-card">
        <h1 class="lms-title">Новый пароль</h1>
        <div id="auth-alert" class="lms-alert" hidden></div>
        <form id="auth-form">
          <div class="lms-field">
            <label class="lms-label" for="password">Новый пароль</label>
            <div class="lms-password-wrap">
              <input class="lms-input" id="password" name="password" type="password" required minlength="8" />
              <button type="button" class="lms-eye-btn" data-password-toggle aria-controls="password">👁</button>
            </div>
          </div>
          <button type="submit" class="lms-btn lms-btn-primary lms-btn-block" id="auth-submit">Сохранить</button>
        </form>
      </div>
    </main>
    <script type="module">
      import { api } from "/js/lms/api.js";
      import { initAuthPage } from "/js/lms/auth-common.js";
      const token = new URLSearchParams(location.search).get("token");
      if (!token) document.getElementById("auth-alert").textContent = "Недействительная ссылка.";
      initAuthPage({
        async onSubmit(fd) {
          await api("/api/auth/reset-password", {
            method: "POST",
            body: { token, password: fd.get("password") },
          });
          window.location.href = "login.html";
        },
      });
    </script>
  </body>
</html>
