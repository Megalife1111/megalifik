<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Мои курсы — MegaLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/lms.css" />
  </head>
  <body class="lms-page">
    <main class="lms-shell" id="app">
      <p class="lms-empty">Загрузка курсов…</p>
    </main>
    <script type="module">
      import { api } from "/js/lms/api.js";
      import { requireUser, renderTopbar, wireLogout } from "/js/lms/shell.js";
      import { renderCourseTile } from "/js/lms/course-ui.js";

      const user = await requireUser();
      if (!user) throw new Error("auth");

      const { courses } = await api("/api/courses");

      const grid =
        courses.length === 0
          ? `<div class="lms-card lms-empty">Пока нет доступных курсов</div>`
          : `<div class="lms-course-grid">${courses.map(renderCourseTile).join("")}</div>`;

      document.getElementById("app").innerHTML = `
        ${renderTopbar(user)}
        <div class="lms-page-head">
          <h1 class="lms-title">Мои курсы</h1>
          <p class="lms-subtitle lms-page-head__sub">Проходите материалы последовательно — прогресс сохраняется автоматически</p>
        </div>
        ${grid}`;
      wireLogout();

      document.querySelectorAll("[data-request]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          try {
            await api(`/api/courses/${btn.dataset.request}/request-access`, { method: "POST", body: {} });
            location.reload();
          } catch (e) {
            alert(e.message);
            btn.disabled = false;
          }
        });
      });
    </script>
  </body>
</html>
