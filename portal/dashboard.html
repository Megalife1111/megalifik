<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Мои курсы — MegaLife</title>
    <link rel="stylesheet" href="/css/lms.css" />
  </head>
  <body class="lms-page">
    <main class="lms-shell" id="app">
      <p class="lms-empty">Загрузка курсов…</p>
    </main>
    <script type="module">
      import { api } from "/js/lms/api.js";
      import { requireUser, renderTopbar, wireLogout, accessLabel } from "/js/lms/shell.js";

      const user = await requireUser();
      if (!user) throw new Error("auth");

      const { courses } = await api("/api/courses");

      const grid =
        courses.length === 0
          ? `<div class="lms-card lms-empty">Пока нет доступных курсов</div>`
          : `<div class="lms-grid">${courses
              .map((c) => {
                const badge = accessLabel(c.access);
                const action = c.access.canView
                  ? `<a class="lms-btn lms-btn-primary" href="course.html?id=${c.id}">Открыть</a>`
                  : c.access.canRequest
                    ? `<button type="button" class="lms-btn lms-btn-ghost" data-request="${c.id}">Запросить доступ</button>`
                    : `<span class="lms-muted">${badge.text}</span>`;
                return `<article class="lms-card lms-course-card">
                    <span class="lms-badge ${badge.cls}">${badge.text}</span>
                    <h3>${c.title}</h3>
                    <p style="color:var(--lms-muted);margin:0">${c.description || ""}</p>
                    <div>
                      <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:6px">
                        <span>Прогресс</span><span>${c.progress.percent}%</span>
                      </div>
                      <div class="lms-progress"><span style="width:${c.progress.percent}%"></span></div>
                    </div>
                    ${action}
                  </article>`;
              })
              .join("")}</div>`;

      document.getElementById("app").innerHTML = `${renderTopbar(user)}<h1 class="lms-title">Мои курсы</h1>${grid}`;
      wireLogout();

      document.querySelectorAll("[data-request]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          try {
            await api(`/api/courses/${btn.dataset.request}/request-access`, { method: "POST", body: {} });
            location.reload();
          } catch (e) {
            alert(e.message);
            btn.disabled = false;
          }
        });
      });
    </script>
  </body>
</html>
