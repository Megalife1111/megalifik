<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Материал — MegaLife</title>
    <link rel="stylesheet" href="/css/lms.css" />
  </head>
  <body class="lms-page">
    <main class="lms-shell" id="app">Загрузка…</main>
    <script type="module">
      import { api } from "/js/lms/api.js";
      import { requireUser, renderTopbar, wireLogout } from "/js/lms/shell.js";

      const user = await requireUser();
      const id = new URLSearchParams(location.search).get("id");
      if (!id) location.href = "dashboard.html";

      const data = await api(`/api/courses/materials/${id}`);
      await api(`/api/courses/materials/${id}/progress`, {
        method: "POST",
        body: { status: "in_progress" },
      });

      const done = data.progress.status === "completed";
      document.getElementById("app").innerHTML = `
        ${renderTopbar(user)}
        <div class="lms-card">
          <p><a class="lms-link" href="course.html?id=${data.course.id}">← ${data.course.title}</a></p>
          <h1 class="lms-title">${data.material.title}</h1>
          <button type="button" class="lms-btn lms-btn-primary lms-btn-block" id="complete-btn" ${done ? "disabled" : ""}>
            ${done ? "Материал пройден" : "Отметить как пройденный"}
          </button>
        </div>
        <div class="lms-frame-wrap">
          <iframe class="lms-frame" title="${data.material.title}" src="${data.material.content_url}"></iframe>
        </div>`;
      wireLogout();

      document.getElementById("complete-btn")?.addEventListener("click", async () => {
        const btn = document.getElementById("complete-btn");
        btn.disabled = true;
        await api(`/api/courses/materials/${id}/progress`, {
          method: "POST",
          body: { status: "completed", metadata: { source: "portal" } },
        });
        btn.textContent = "Материал пройден";
      });
    </script>
  </body>
</html>
